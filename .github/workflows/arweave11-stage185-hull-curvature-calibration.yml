name: Arweave 11 Stage185 source-blind curved hull calibration
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage185-hull-curvature-calibration.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage185_hull_curve_fragment_positive_audit.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arweave11-stage185
  cancel-in-progress: false
jobs:
  stage185:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install unchanged detector dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile Stage185
        run: python -m py_compile "$PZL/tools/stage185_hull_curve_fragment_positive_audit.py"
      - name: Stage185 preregistered source-blind hull calibration
        run: python "$PZL/tools/stage185_hull_curve_fragment_positive_audit.py"
      - name: Archive Stage185 research report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage185-hull-curvature-calibration"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage185 curved hull calibration results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
