name: Arweave 11 stage 140 giant-to-small sail fingerprint
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage140-cross-scale-sail-motif.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage140_cross_scale_sail_motif.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage140-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check analysis script
        run: python -m py_compile "$PZL/tools/stage140_cross_scale_sail_motif.py"
      - name: Execute Stage140
        run: python "$PZL/tools/stage140_cross_scale_sail_motif.py"
      - name: Commit calibrated image-only measurements
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage140-cross-scale-sail-motif"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage140 scaled sail drawing comparisons [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
