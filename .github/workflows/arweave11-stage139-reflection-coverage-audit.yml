name: Arweave 11 stage 139 reflection source-coverage audit
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage139-reflection-coverage-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage139_reflection_coverage_audit.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage139-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check script
        run: python -m py_compile "$PZL/tools/stage139_reflection_coverage_audit.py"
      - name: Execute Stage139
        run: python "$PZL/tools/stage139_reflection_coverage_audit.py"
      - name: Commit nonsecret source metrics
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage139-reflection-coverage-audit"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage139 source coverage and gated reflections [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
