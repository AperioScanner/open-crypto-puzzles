name: Arweave 11 research stage 95 grayscale 16 level alphabet

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage95-grayscale-16level-alphabet.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage95_grayscale_16level_alphabet.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  grayscale-16level-alphabet:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy pillow opencv-python-headless
      - name: Run Stage 95
        run: python "$PZL/tools/stage95_grayscale_16level_alphabet.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage95-grayscale-16level-alphabet"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 95 grayscale 16-level alphabet results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
