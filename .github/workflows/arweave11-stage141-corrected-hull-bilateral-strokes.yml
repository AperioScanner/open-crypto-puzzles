name: Arweave 11 stage 141 corrected hull bilateral pencil strokes
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage141-corrected-hull-bilateral-strokes.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage141_corrected_hull_bilateral_strokes.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage141-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Syntax check
        run: python -m py_compile "$PZL/tools/stage141_corrected_hull_bilateral_strokes.py"
      - name: Execute Stage 141 image-only test
        run: python "$PZL/tools/stage141_corrected_hull_bilateral_strokes.py"
      - name: Commit nonsecret hull diagnostic results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage141-corrected-hull-bilateral-strokes"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage141 corrected large hull stroke mirror result [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
