name: Arweave 11 stage 179 eight peak positional identity
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage179-peak-position-identity.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage179_eight_peak_positional_identity.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage179:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy
      - run: python -m py_compile "$PZL/tools/stage179_eight_peak_positional_identity.py"
      - run: python "$PZL/tools/stage179_eight_peak_positional_identity.py"
      - name: Archive Stage179 frozen peak identity results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage179-eight-peak-identity"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage179 archived peak positional identity audit [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
