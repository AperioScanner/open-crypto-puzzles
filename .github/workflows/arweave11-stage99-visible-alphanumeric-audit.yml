name: Arweave 11 research stage 99 visible alphanumeric audit

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage99-visible-alphanumeric-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage99_visible_alphanumeric_audit.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage96-puzzle9-four-step-audit/puzzle9-primary.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visible-alphanumeric-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install system OCR
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr
      - name: Install Python dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run Stage 99
        run: python "$PZL/tools/stage99_visible_alphanumeric_audit.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage99-visible-alphanumeric-audit"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 99 visible-alphanumeric audit results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
