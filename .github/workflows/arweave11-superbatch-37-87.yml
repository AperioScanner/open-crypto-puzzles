name: Arweave 11 superbatch stages 37 to 87

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-superbatch-37-87.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/superbatch_stage37_87.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/superbatch/STAGE_37_86_MANIFEST.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage31-format-invariance/result.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arweave11-superbatch-37-87
  cancel-in-progress: false

jobs:
  superbatch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run safe superbatch 37-87
        run: python "$PZL/tools/superbatch_stage37_87.py"
      - name: Commit superbatch results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/superbatch-37-87"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: superbatch stages 37-87 results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
