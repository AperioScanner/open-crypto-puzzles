name: Arweave 11 stage 150 V facade lower hatch jitter
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage150-v-lower-facade-jitter.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage150_v_facade_lower_h_perturb.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage150-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Verify script compiles
        run: python -m py_compile "$PZL/tools/stage150_v_facade_lower_h_perturb.py"
      - name: Run Stage150 fixed jitter study
        run: python "$PZL/tools/stage150_v_facade_lower_h_perturb.py"
      - name: Commit public visual geometry report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage150-v-base-layer-perturb"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage150 V base hatch jitter results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
