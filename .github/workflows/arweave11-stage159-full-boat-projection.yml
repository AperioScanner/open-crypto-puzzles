name: Arweave 11 stage 159 corrected full large-boat projection
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage159-full-boat-projection.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage159_full_boat_projection_provenance.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage159:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage159_full_boat_projection_provenance.py"
      - run: python "$PZL/tools/stage159_full_boat_projection_provenance.py"
      - name: Commit isolated Stage159 source audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage159-full-boat-projection"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage159 full large-boat projection results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
