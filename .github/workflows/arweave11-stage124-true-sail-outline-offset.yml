name: Arweave 11 stage 124 true-five-sail outline offsets
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage124-true-sail-outline-offset.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage124_true_sail_outline_offset.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage124:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile analysis script
        run: python -m py_compile "$PZL/tools/stage124_true_sail_outline_offset.py"
      - name: Run Stage 124
        run: python "$PZL/tools/stage124_true_sail_outline_offset.py"
      - name: Commit public visual metrics
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage124-true-sail-outline-offset"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage124 real-image outlines [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
