name: Arweave 11 stage 183 known 256 global matching control
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage183-known256-optimal-matching.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage183_known256_maximum_match_audit.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage183:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage183_known256_maximum_match_audit.py"
      - name: Source-blind positive known256 matching control
        run: python "$PZL/tools/stage183_known256_maximum_match_audit.py"
      - name: Archive Stage183 known 256 fixture matching sensitivity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage183-known256-maxmatching"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage183 known256 maximum match diagnosis [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
