name: Arweave 11 stage 182 known 256 stroke positive calibration
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage182-known-256-full-gate.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage182_positive_synthetic_full_sail_capacity_gate.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage182:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage182_positive_synthetic_full_sail_capacity_gate.py"
      - name: Run source-blind Stage182 full known carrier controls
        run: python "$PZL/tools/stage182_positive_synthetic_full_sail_capacity_gate.py"
      - name: Archive Stage182 synthetic-only audit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage182-known-256-capacity"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage182 synthetic full-gate sensitivity results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
