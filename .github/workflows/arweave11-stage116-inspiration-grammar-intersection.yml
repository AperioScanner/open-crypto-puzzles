name: Arweave 11 research stage 116 inspiration grammar intersection

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage116-inspiration-grammar-intersection.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage116_inspiration_grammar_intersection.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/tiamat-inspiration-solution-grammar.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage115-tiamat-reddit-inspiration/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspiration-grammar-intersection:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run Stage 116
        run: python "$PZL/tools/stage116_inspiration_grammar_intersection.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage116-inspiration-grammar-intersection"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 116 inspiration-grammar results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
