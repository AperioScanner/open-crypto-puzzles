name: Arweave 11 research stage 5 visual structure

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage5-visual-structure.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage5_visual_structure.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Measure skyline hatch orientations
        run: python "$PZL/tools/stage5_visual_structure.py"
      - name: Commit non-secret results
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage5-visual-structure"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 5 visual-structure results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
