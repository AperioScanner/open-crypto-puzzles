name: Arweave 11 accelerated research pipeline 22-27

on:
  workflow_dispatch:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-accelerated-pipeline-22-27.yml"

permissions:
  contents: write

concurrency:
  group: arweave11-accelerated-pipeline
  cancel-in-progress: false

jobs:
  pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install research dependencies once
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless

      - name: Stage 22 — close visual 321 hypothesis
        run: python "$PZL/tools/stage22_321_stop_rule.py"

      - name: Stage 23 — bitplane statistics
        run: python "$PZL/tools/stage23_bitplane_statistics.py"

      - name: Stage 24 — RS-style LSB diagnostics
        run: python "$PZL/tools/stage24_rs_lsb.py"

      - name: Stage 25 — local bit anomaly maps
        run: python "$PZL/tools/stage25_local_bit_anomalies.py"

      - name: Stage 26 — spectral / autocorrelation diagnostics
        run: python "$PZL/tools/stage26_spectral_bitplanes.py"

      - name: Stage 27 — traversal-order byte diagnostics
        run: python "$PZL/tools/stage27_traversal_byte_diagnostics.py"

      - name: Record pipeline completion
        shell: bash
        run: |
          mkdir -p "$PZL/analysis/runs/accelerated-pipeline"
          {
            echo "# Accelerated pipeline 22–27"
            echo
            echo "Completed successfully in one GitHub Actions run."
            echo
            echo "- Stage 22: visual 321 stop rule"
            echo "- Stage 23: bitplane statistics"
            echo "- Stage 24: RS-style LSB diagnostics"
            echo "- Stage 25: local anomaly maps"
            echo "- Stage 26: spectral/autocorrelation diagnostics"
            echo "- Stage 27: traversal-order byte diagnostics"
            echo
            echo "See each stage REPORT.md/result.json for evidence."
          } > "$PZL/analysis/runs/accelerated-pipeline/REPORT.md"

      - name: Commit all non-secret results atomically
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add             "$PZL/analysis/runs/stage22-321-stop-rule"             "$PZL/analysis/runs/stage23-bitplane-statistics"             "$PZL/analysis/runs/stage24-rs-lsb"             "$PZL/analysis/runs/stage25-local-bit-anomalies"             "$PZL/analysis/runs/stage26-spectral-bitplanes"             "$PZL/analysis/runs/stage27-traversal-byte-diagnostics"             "$PZL/analysis/runs/accelerated-pipeline"
          if git diff --cached --quiet; then
            echo "No new results to commit."
            exit 0
          fi
          git commit -m "research: accelerated pipeline stages 22-27 [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
