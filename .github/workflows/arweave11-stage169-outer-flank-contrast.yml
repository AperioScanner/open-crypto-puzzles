name: Arweave 11 stage 169 outer sail edge flank contrast
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage169-outer-flank-contrast.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage169_sail_outer_flank_contrast.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage169:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage169_sail_outer_flank_contrast.py"
      - run: python "$PZL/tools/stage169_sail_outer_flank_contrast.py"
      - name: Save Stage169 isolated source/fixture results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage169-sail-outer-flank-contrast"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage169 exterior flank source audit [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
