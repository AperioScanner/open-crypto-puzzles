name: Arweave 11 stage 155 legacy small-sail band source audit
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage155-small-sail-band-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage155_legacy_small_sail_band_audit.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage155:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image analysis libraries
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile source-audit script
        run: python -m py_compile "$PZL/tools/stage155_legacy_small_sail_band_audit.py"
      - name: Stage155 canonical image and calibration controls
        run: python "$PZL/tools/stage155_legacy_small_sail_band_audit.py"
      - name: Archive Stage155 source audit only
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage155-small-sail-band-audit"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage155 small-sail band audit results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
