name: Arweave 11 research stage 98 Puzzle 9 Twitter thread

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage98-puzzle9-twitter-thread.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage98_puzzle9_twitter_thread.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage97-puzzle9-semantic-anchors/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  puzzle9-twitter-thread:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run Stage 98
        run: python "$PZL/tools/stage98_puzzle9_twitter_thread.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage98-puzzle9-twitter-thread"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 98 Puzzle 9 Twitter-thread results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
