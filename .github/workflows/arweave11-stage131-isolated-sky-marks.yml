name: Arweave 11 stage 131 isolated sky marks
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage131-isolated-sky-marks.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage131_sky_isolated_marks.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage131:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Validate source
        run: python -m py_compile "$PZL/tools/stage131_sky_isolated_marks.py"
      - name: Execute Stage 131
        run: python "$PZL/tools/stage131_sky_isolated_marks.py"
      - name: Commit reports
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage131-isolated-sky-marks"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage131 isolated sky mark results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
