name: Arweave 11 stage 132 image-only large sail ROI coverage
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage132-large-sail-roi-coverage.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage132_large_sail_legacy_bbox_audit.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage132:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Syntax check
        run: python -m py_compile "$PZL/tools/stage132_large_sail_legacy_bbox_audit.py"
      - name: Run Stage 132 image-only ROI coverage
        run: python "$PZL/tools/stage132_large_sail_legacy_bbox_audit.py"
      - name: Commit measured ROI diagnostics
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage132-large-sail-roi-coverage"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage132 old-vs-visible sail ROI measurements [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
