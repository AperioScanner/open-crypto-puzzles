name: Arweave 11 stage 177 upper sail trace continuity
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage177-upper-sail-eight-peaks.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage177_eight_lower_peaks_upper_continuation.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage177:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless scipy
      - run: python -m py_compile "$PZL/tools/stage177_eight_lower_peaks_upper_continuation.py"
      - run: python "$PZL/tools/stage177_eight_lower_peaks_upper_continuation.py"
      - name: Archive Stage177 disjoint upper ink support results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage177-eight-peak-upper-continuation"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage177 upper-source peak continuity results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
