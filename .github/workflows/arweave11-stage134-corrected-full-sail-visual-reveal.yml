name: Arweave 11 stage 134 corrected full-sail visual-reveal control audit
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage134-corrected-full-sail-visual-reveal.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage134_corrected_full_sail_visual_reveal.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage134-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check source
        run: python -m py_compile "$PZL/tools/stage134_corrected_full_sail_visual_reveal.py"
      - name: Run Stage134 full-sail visual analysis
        run: python "$PZL/tools/stage134_corrected_full_sail_visual_reveal.py"
      - name: Commit image-only diagnostic data
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage134-corrected-large-sail-visual-reveal"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage134 corrected full sail visual metrics [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
