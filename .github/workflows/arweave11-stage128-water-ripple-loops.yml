name: Arweave 11 stage 128 image-only water ripple loops
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage128-water-ripple-loops.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage128_water_ripple_loops.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage128:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile script
        run: python -m py_compile "$PZL/tools/stage128_water_ripple_loops.py"
      - name: Execute Stage 128
        run: python "$PZL/tools/stage128_water_ripple_loops.py"
      - name: Commit public visual metrics
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage128-water-ripple-loops"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage128 water ripple topology [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
