name: Arweave 11 stage 175 old spoke apex source audit
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage175-spoke-apex-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage175_stage105_spoke_apex_provenance.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage175:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile "$PZL/tools/stage175_stage105_spoke_apex_provenance.py"
      - run: python "$PZL/tools/stage175_stage105_spoke_apex_provenance.py"
      - name: Commit isolated Stage175 source provenance
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage175-stage105-apex-audit"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage175 known Stage105 apex QA result [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
