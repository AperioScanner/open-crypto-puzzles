name: Arweave 11 stage 176 calibrated sail radial ink
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage176-true-apex-radial-profile.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage176_true_sail_radial_profile.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage176:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless scipy
      - run: python -m py_compile "$PZL/tools/stage176_true_sail_radial_profile.py"
      - run: python "$PZL/tools/stage176_true_sail_radial_profile.py"
      - name: Archive Stage176 true-sail ray count result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage176-true-sail-radial-profile"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage176 true-sail radial ink results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
