name: Arweave 11 stage 151 under-pier triangle versus sails
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage151-under-pier-triangle.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage151_under_pier_triangle.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage151-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Validate Python
        run: python -m py_compile "$PZL/tools/stage151_under_pier_triangle.py"
      - name: Run Stage151 image-only triangle comparison
        run: python "$PZL/tools/stage151_under_pier_triangle.py"
      - name: Commit public source diagram report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage151-under-pier-triangle"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage151 under-pier sail check [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
