name: Arweave 11 stage 163 source provenance census
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage163-superbatch-source-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage163_superbatch_source_provenance_census.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage163:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m py_compile "$PZL/tools/stage163_superbatch_source_provenance_census.py"
      - run: python "$PZL/tools/stage163_superbatch_source_provenance_census.py"
      - name: Archive Stage163 source-only dependency report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage163-superbatch-source-provenance"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage163 source-crop dependency results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
