name: Arweave 11 research stage 91 historical clue reconciliation

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage91-historical-clue-reconciliation.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage91_historical_clue_reconciliation.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/**"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  historical-clue-reconciliation:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests
      - name: Run Stage 91
        run: python "$PZL/tools/stage91_historical_clue_reconciliation.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage91-historical-clue-reconciliation"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 91 historical clue reconciliation results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
