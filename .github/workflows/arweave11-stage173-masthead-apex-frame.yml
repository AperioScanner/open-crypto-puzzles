name: Arweave 11 stage 173 masthead apex source frame audit
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage173-masthead-apex-frame.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage173_masthead_apex_frame_audit.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage173:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage173_masthead_apex_frame_audit.py"
      - run: python "$PZL/tools/stage173_masthead_apex_frame_audit.py"
      - name: Archive Stage173 source-position proof
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage173-masthead-apex-frame"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage173 masthead source-frame QA [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
