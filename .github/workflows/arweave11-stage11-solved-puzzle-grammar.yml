name: Arweave 11 research stage 11 solved puzzle grammar

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage11-solved-puzzle-grammar.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage11_solved_puzzle_grammar.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage4-author-archive/REPORT.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  solved-puzzle-grammar:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build solved-puzzle design grammar
        run: python "$PZL/tools/stage11_solved_puzzle_grammar.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage11-solved-puzzle-grammar"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 11 solved-puzzle grammar [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
