name: Arweave 11 research stage 105 small sail spoke count

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage105-small-sail-spoke-count.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage105_small_sail_spoke_count.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage19-small-sail-remeasure/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  small-sail-spoke-count:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run Stage 105
        run: python "$PZL/tools/stage105_small_sail_spoke_count.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage105-small-sail-spoke-count"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 105 small-sail spoke-count results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
