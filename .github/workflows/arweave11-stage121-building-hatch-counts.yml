name: Arweave 11 stage 121 image-only building hatch counts

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage121-building-hatch-counts.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage121_building_hatch_line_counts.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage121:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Execute Stage 121
        run: python "$PZL/tools/stage121_building_hatch_line_counts.py"
      - name: Commit non-secret geometry results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage121-building-hatch-line-counts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage121 geometry results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
