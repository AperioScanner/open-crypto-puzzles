name: Arweave 11 stage 165 corrected true sail width-to-gap
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage165-corrected-width-gap.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage165_corrected_true_sail_width_gap.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage165:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage165_corrected_true_sail_width_gap.py"
      - run: python "$PZL/tools/stage165_corrected_true_sail_width_gap.py"
      - name: Archive Stage165 bounded source correlation findings
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage165-corrected-sail-width-gap"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage165 corrected sail base width-gap results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
