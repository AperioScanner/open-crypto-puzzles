name: Arweave 11 stage 123 image-only cross-region strokes

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage123-cross-region-stroke-reuse.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage123_cross_region_stroke_reuse.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage123:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check script syntax
        run: python -m py_compile "$PZL/tools/stage123_cross_region_stroke_reuse.py"
      - name: Run Stage 123
        run: python "$PZL/tools/stage123_cross_region_stroke_reuse.py"
      - name: Commit image-only measurements
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage123-cross-region-stroke-reuse"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage123 image-only cross-region results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
