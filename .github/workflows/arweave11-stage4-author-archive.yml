name: Arweave 11 research stage 4 author archive

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage4-author-archive.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage4_author_archive.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  author-archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check openpyxl
      - name: Fetch public tweet archive mirror
        run: curl -fL --retry 3 -o /tmp/ArweaveP_user_tweets.xlsx https://raw.githubusercontent.com/HomelessPhD/AR_Puzzles/main/ArweaveP_user_tweets.xlsx
      - name: Recover puzzle-related author rows
        run: python "$PZL/tools/stage4_author_archive.py"
      - name: Commit recovered public clues
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage4-author-archive"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: recover author-archive clues [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
