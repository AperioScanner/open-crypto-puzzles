name: Arweave 11 research stage 15 semantic 321 counts

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage15-semantic-321-counts.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage15_semantic_321_counts.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  semantic-321-counts:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy opencv-python-headless
      - name: Run semantic 321 count test
        run: python "$PZL/tools/stage15_semantic_321_counts.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage15-semantic-321-counts"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 15 semantic 321 count results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
