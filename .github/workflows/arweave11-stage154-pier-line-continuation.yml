name: Arweave 11 stage 154 pier line continuation
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage154-pier-line-continuation.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage154_under_pier_outward_continuations.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage154:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scientific image dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile Stage154
        run: python -m py_compile "$PZL/tools/stage154_under_pier_outward_continuations.py"
      - name: Execute original-image Stage154 and fixed synthetic controls
        run: python "$PZL/tools/stage154_under_pier_outward_continuations.py"
      - name: Persist reproducible Stage154 report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage154-under-pier-outward-continuations"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage154 outward continuation results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
