name: Arweave 11 stage 164 Stage112 true sail crop coverage
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage164-stage112-crop-audit.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage164_stage112_sail_roi_coverage_audit.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage164:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage164_stage112_sail_roi_coverage_audit.py"
      - run: python "$PZL/tools/stage164_stage112_sail_roi_coverage_audit.py"
      - name: Archive isolated Stage164 source QA
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage164-stage112-sail-coverage"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage164 Stage112 sail crop source results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
