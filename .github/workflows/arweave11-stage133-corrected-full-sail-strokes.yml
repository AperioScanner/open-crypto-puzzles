name: Arweave 11 stage 133 corrected full large-sail stroke audit
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage133-corrected-full-sail-strokes.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage133_corrected_full_sail_strokes.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage133-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check syntax
        run: python -m py_compile "$PZL/tools/stage133_corrected_full_sail_strokes.py"
      - name: Compare corrected full-sail and legacy Stage94 ROIs
        run: python "$PZL/tools/stage133_corrected_full_sail_strokes.py"
      - name: Commit public nonsecret measurements
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage133-corrected-large-sail-strokes"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage133 full sail count comparison [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
