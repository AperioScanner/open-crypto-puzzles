name: Arweave 11 stage 129 corrected small-sail hatch direction
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage129-corrected-sail-hatch-direction.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage129_corrected_sail_hatch_direction.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage129-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image-analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check script syntax
        run: python -m py_compile "$PZL/tools/stage129_corrected_sail_hatch_direction.py"
      - name: Execute Stage 129
        run: python "$PZL/tools/stage129_corrected_sail_hatch_direction.py"
      - name: Commit public analysis results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage129-corrected-sail-hatch-direction"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage129 corrected sail-hatch results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
