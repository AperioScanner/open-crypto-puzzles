name: Arweave 11 Stage184 full-canvas synthetic calibration
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage184-full-canvas-transform.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage184_full_canvas_transform_calibration.py"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: arweave11-stage184
  cancel-in-progress: false
jobs:
  stage184:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage184_full_canvas_transform_calibration.py"
      - name: Source-blind full-scene transform comparison
        run: python "$PZL/tools/stage184_full_canvas_transform_calibration.py"
      - name: Archive reproducible Stage184 results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage184-full-canvas-transform-calibration"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage184 synthetic transform calibration results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
