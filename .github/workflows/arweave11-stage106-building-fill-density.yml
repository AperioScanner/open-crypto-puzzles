name: Arweave 11 research stage 106 building fill density

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage106-building-fill-density.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage106_building_fill_density.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage12-count-perimeter/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  building-fill-density:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run Stage 106
        run: python "$PZL/tools/stage106_building_fill_density.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage106-building-fill-density"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 106 building fill-density results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
