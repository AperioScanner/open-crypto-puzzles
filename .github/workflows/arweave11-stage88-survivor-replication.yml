name: Arweave 11 research stage 88 survivor replication

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage88-survivor-replication.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage88_superbatch_survivor_replication.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage19-small-sail-remeasure/result.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/superbatch-37-87/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  survivor-replication:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run adaptive Stage 88
        run: python "$PZL/tools/stage88_superbatch_survivor_replication.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage88-superbatch-survivor-replication"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 88 superbatch survivor replication [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
