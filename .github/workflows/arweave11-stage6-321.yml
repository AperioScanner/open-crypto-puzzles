name: Arweave 11 research stage 6 skyline 321

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage6-321.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage6_321.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  skyline-321:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless pycryptodome coincurve
      - name: Run bounded 321 follow-up
        shell: bash
        run: |
          set +e
          python "$PZL/tools/stage6_321.py"
          rc=$?
          set -e
          if [ "$rc" -eq 78 ]; then
            echo "Exact target match detected; secret candidate intentionally not persisted."
            exit 78
          fi
          exit "$rc"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage6-321"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 6 skyline-321 results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
