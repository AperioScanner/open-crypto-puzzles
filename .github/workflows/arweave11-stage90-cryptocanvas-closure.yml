name: Arweave 11 research stage 90 cryptocanvas closure

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage90-cryptocanvas-closure.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage90_cryptocanvas_closure.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage89-cryptocanvas-provenance/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cryptocanvas-closure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests numpy pillow opencv-python-headless
      - name: Run Stage 90
        run: python "$PZL/tools/stage90_cryptocanvas_closure.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage90-cryptocanvas-closure"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 90 cryptocanvas closure results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
