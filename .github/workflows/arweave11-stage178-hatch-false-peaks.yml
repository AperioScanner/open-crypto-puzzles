name: Arweave 11 stage 178 diagonal hatch false-peak countermodel
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage178-hatch-false-peaks.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage178_dense_sail_hatch_false_peaks.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage178:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy scipy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage178_dense_sail_hatch_false_peaks.py"
      - name: Stage178 calibrated source-blind hatching countermodel
        run: python "$PZL/tools/stage178_dense_sail_hatch_false_peaks.py"
      - name: Archive isolated Stage178 result and controls
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage178-dense-hatch-false-peaks"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage178 hatch countermodel results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
