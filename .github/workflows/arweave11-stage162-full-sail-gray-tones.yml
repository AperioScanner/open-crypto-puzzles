name: Arweave 11 stage 162 corrected giant-sail grayscale alphabet
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage162-full-sail-gray-tones.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage162_corrected_full_sail_grayscale_alphabet.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage162:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless requests
      - run: python -m py_compile "$PZL/tools/stage162_corrected_full_sail_grayscale_alphabet.py"
      - run: python "$PZL/tools/stage162_corrected_full_sail_grayscale_alphabet.py"
      - name: Persist isolated Stage162 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage162-full-sail-grayscale-alphabet"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage162 corrected full sail tone results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
