name: Arweave 11 stage 135 full-sail quadrant orientation
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage135-full-sail-quadrant-orientation.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage135_full_sail_quadrant_orientation.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage135-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile analysis
        run: python -m py_compile "$PZL/tools/stage135_full_sail_quadrant_orientation.py"
      - name: Run Stage 135 image-only quadrant analysis
        run: python "$PZL/tools/stage135_full_sail_quadrant_orientation.py"
      - name: Commit public aggregate visual report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage135-full-sail-quadrant-orientation"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage135 aggregate quadrant results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
