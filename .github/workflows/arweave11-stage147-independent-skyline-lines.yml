name: Arweave 11 stage 147 independent skyline horizontal detectors
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage147-independent-skyline-lines.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage147_skyline_independent_orientation.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage147-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check script syntax
        run: python -m py_compile "$PZL/tools/stage147_skyline_independent_orientation.py"
      - name: Run independent Stage 147
        run: python "$PZL/tools/stage147_skyline_independent_orientation.py"
      - name: Commit source analysis report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage147-independent-skyline-line-detectors"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage147 independent skyline line metrics [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
