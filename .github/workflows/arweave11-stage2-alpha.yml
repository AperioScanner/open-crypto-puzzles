name: Arweave 11 research stage 2 alpha

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage2-alpha.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage2_alpha_sweep.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha-sweep:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow eth-keys pycryptodome

      - name: Run bounded alpha sweep
        id: sweep
        shell: bash
        run: |
          set +e
          python "$PZL/tools/stage2_alpha_sweep.py"
          rc=$?
          set -e
          if [ "$rc" -eq 78 ]; then
            echo "Exact target match detected. Candidate material was intentionally not persisted."
            exit 78
          fi
          exit "$rc"

      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin research/arweave11-chatgpt
          git add "$PZL/analysis/runs/stage2-alpha"
          if git diff --cached --quiet; then
            echo "No result changes"
            exit 0
          fi
          git commit -m "research: stage 2 alpha sweep results [skip ci]"
          git push origin HEAD:research/arweave11-chatgpt
