name: Arweave 11 research stage 93 pier Roman structure

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage93-pier-roman-structure.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage93_pier_roman_structure.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  pier-roman-structure:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run Stage 93
        run: python "$PZL/tools/stage93_pier_roman_structure.py"
      - name: Commit public non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage93-pier-roman-structure"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 93 pier Roman-structure results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
