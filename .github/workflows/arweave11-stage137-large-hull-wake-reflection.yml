name: Arweave 11 stage 137 image-only large hull wake reflection

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage137-large-hull-wake-reflection.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage137_large_hull_wake_reflection.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage137:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile Python
        run: python -m py_compile "$PZL/tools/stage137_large_hull_wake_reflection.py"
      - name: Run Stage 137
        run: python "$PZL/tools/stage137_large_hull_wake_reflection.py"
      - name: Commit nonsecret visual report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage137-large-hull-wake-reflection"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage137 full hull wake visual correlation [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
