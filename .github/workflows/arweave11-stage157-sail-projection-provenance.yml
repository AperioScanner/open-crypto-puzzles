name: Arweave 11 stage 157 corrected sail projection provenance
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage157-sail-projection-provenance.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage157_corrected_sail_projection_provenance.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage157:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage157_corrected_sail_projection_provenance.py"
      - run: python "$PZL/tools/stage157_corrected_sail_projection_provenance.py"
      - name: Archive isolated Stage157 results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage157-corrected-sail-projection"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage157 corrected sail projection results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
