name: Arweave 11 stage 138 all-building reflection correction
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage138-all-building-reflection-recheck.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage138_corrected_all_building_reflections.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage138-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Validate Python
        run: python -m py_compile "$PZL/tools/stage138_corrected_all_building_reflections.py"
      - name: Run Stage 138
        run: python "$PZL/tools/stage138_corrected_all_building_reflections.py"
      - name: Commit image-only reports
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage138-all-building-reflection-recheck"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage138 corrected all-building reflection results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
