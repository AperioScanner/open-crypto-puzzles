name: Arweave 11 stage 171 synthetic adjacent-boat confound
on:
  push:
    branches: [research/arweave11-chatgpt]
    paths:
      - ".github/workflows/arweave11-stage171-neighbor-boat-confound.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage171_neighbor_boat_line_confound.py"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  stage171:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - run: python -m py_compile "$PZL/tools/stage171_neighbor_boat_line_confound.py"
      - run: python "$PZL/tools/stage171_neighbor_boat_line_confound.py"
      - name: Archive synthetic-only Stage171 adversarial report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage171-neighbor-boat-confounds"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage171 neighboring-stroke synthetic failure-mode results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
