name: Arweave 11 research stage 13 321 null model

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage13-321-null-model.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage13_321_null_model.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/analysis/runs/stage10-marker-robustness/result.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  null-model:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compute 321 null models
        run: python "$PZL/tools/stage13_321_null_model.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage13-321-null-model"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 13 321 null-model results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
