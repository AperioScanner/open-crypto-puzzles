name: Arweave 11 stage 144 reversed skyline spire provenance
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage144-rotated-skyline-spire.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage144_rotated_skyline_spire.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage144-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check Python syntax
        run: python -m py_compile "$PZL/tools/stage144_rotated_skyline_spire.py"
      - name: Run Stage144 spire provenance test
        run: python "$PZL/tools/stage144_rotated_skyline_spire.py"
      - name: Commit image-only comparison report
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage144-rotated-skyline-spire"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage144 skyline spire provenance [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
