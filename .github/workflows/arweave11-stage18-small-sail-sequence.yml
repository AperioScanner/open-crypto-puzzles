name: Arweave 11 research stage 18 small sail sequence

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage18-small-sail-sequence.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage18_small_sail_sequence.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sail-sequence:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Analyze small-sail width sequence
        run: python "$PZL/tools/stage18_small_sail_sequence.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage18-small-sail-width-sequence"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 18 small sail sequence results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
