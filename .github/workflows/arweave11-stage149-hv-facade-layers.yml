name: Arweave 11 stage 149 facade H V layer coherence
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage149-hv-facade-layers.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage149_hv_within_facade_layers.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage149-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install image analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile script
        run: python -m py_compile "$PZL/tools/stage149_hv_within_facade_layers.py"
      - name: Run Stage149 facade layer validation
        run: python "$PZL/tools/stage149_hv_within_facade_layers.py"
      - name: Commit image-only facade measurements
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage149-hv-facade-layers"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage149 fixed facade height layer results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
