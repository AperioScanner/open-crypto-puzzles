name: Arweave 11 stage 122 image-only sail side shading

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage122-sail-side-shading.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage122_sail_side_shading.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  image-only-stage122:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Compile Stage 122 script
        run: python -m py_compile "$PZL/tools/stage122_sail_side_shading.py"
      - name: Run Stage 122 - six sail signed shading
        run: python "$PZL/tools/stage122_sail_side_shading.py"
      - name: Commit public image-only results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage122-sail-side-shading"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage122 six sail shading results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
