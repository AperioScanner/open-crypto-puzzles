name: Arweave 11 research stage 17 orientation geometry independence

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage17-orientation-geometry-independence.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage17_orientation_geometry_independence.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  orientation-geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run exact geometry-independence test
        run: python "$PZL/tools/stage17_orientation_geometry_independence.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage17-orientation-geometry-independence"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 17 orientation geometry results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
