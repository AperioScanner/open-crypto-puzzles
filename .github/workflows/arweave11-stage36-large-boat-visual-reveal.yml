name: Arweave 11 research stage 36 large boat visual reveal

on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage36-large-boat-visual-reveal.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage36_large_boat_visual_reveal.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  large-boat-visual-reveal:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Run adaptive Stage 36
        run: python "$PZL/tools/stage36_large_boat_visual_reveal.py"
      - name: Commit non-secret results
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage36-large-boat-visual-reveal"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: stage 36 large-boat visual-reveal results [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
