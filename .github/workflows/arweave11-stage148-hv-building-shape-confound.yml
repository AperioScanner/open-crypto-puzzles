name: Arweave 11 stage 148 visual building proportions vs H/V
on:
  push:
    branches:
      - research/arweave11-chatgpt
    paths:
      - ".github/workflows/arweave11-stage148-hv-building-shape-confound.yml"
      - "2-mid-prizes/arweave-puzzle-11-1eth/tools/stage148_hv_building_aspect_confounds.py"
      - "2-mid-prizes/arweave-puzzle-11-1eth/clues/arweave-puzzle-11.png"
      - "2-mid-prizes/arweave-puzzle-11-1eth/data/geometry.json"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  stage148-image-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PZL: 2-mid-prizes/arweave-puzzle-11-1eth
    steps:
      - uses: actions/checkout@v4
        with:
          ref: research/arweave11-chatgpt
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install analysis dependencies
        run: python -m pip install --disable-pip-version-check numpy pillow opencv-python-headless
      - name: Check code
        run: python -m py_compile "$PZL/tools/stage148_hv_building_aspect_confounds.py"
      - name: Run Stage148 natural building hatching controls
        run: python "$PZL/tools/stage148_hv_building_aspect_confounds.py"
      - name: Commit public calibrated image findings
        if: success()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$PZL/analysis/runs/stage148-hv-building-shape-confound"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "research: Stage148 natural building shape and H/V result [skip ci]"
          git pull --rebase origin research/arweave11-chatgpt
          git push origin HEAD:research/arweave11-chatgpt
